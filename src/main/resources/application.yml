spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mysocialnetwork
    username: postgres
    password: secret
  application:
    name: my-social-network
  mvc:
    problemdetails:
      enabled: true
  flyway:
    baseline-on-migrate: true
  docker:
    compose:
      lifecycle-management: start_only
      enabled: false

spicedb:
  host: localhost
  grpc-port: 50051